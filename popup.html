<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; padding: 15px; font-family: sans-serif; background: #141519; color: white; }
    h3 { color: #f47521; margin: 0 0 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .item { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    select, input { width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; }
    .row .item { flex: 1; }
    .key-row { display: flex; gap: 8px; align-items: flex-end; }
    .key-row .item { flex: 1; margin-bottom: 0; }
    .btn-secondary {
      flex-shrink: 0; width: auto; margin-top: 0; padding: 8px 10px;
      background: #333; border: 1px solid #555; color: #ddd; font-weight: normal; font-size: 12px;
    }
    .btn-secondary:hover { background: #444; }
    .btn-secondary:disabled { background: #2a2a2a; color: #777; }
    .btn-export {
      display: inline-block; width: auto; padding: 8px 10px; background: #213a52; border: 1px solid #4a7bb5; color: #dceeff; font-weight: 600; font-size: 12px; cursor: pointer; border-radius: 4px;
    }
    .btn-export:hover { background: #2a4c72; }
    .btn-export:disabled { background: #2a2a2a; color: #777; border-color: #444; cursor: not-allowed; }
    .hint { font-size: 11px; color: #888; margin-top: 4px; min-height: 14px; }
    .hint.error { color: #FF6B6B; }
    .hint.ok { color: #7dcea0; }
    button#save-btn { width: 100%; padding: 10px; background: #f47521; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
    button#save-btn:hover { background: #ff8c3a; }
    button#save-btn:disabled { background: #666; cursor: not-allowed; }
    .status { display: none; margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 12px; text-align: center; }
    .status.success { background: #1a3a1a; color: #55FF55; border: 1px solid #55FF55; }
    .status.error { background: #3a1a1a; color: #FF6B6B; border: 1px solid #FF6B6B; }
  </style>
</head>
<body>
  <h3 id="title"></h3>
  <div id="save-status" class="status"></div>

  <div class="row">
    <div class="item">
        <label id="label-lang"></label>
        <select id="lang-select">
            <option value="zh-CN">zh-CN</option>
            <option value="zh-HK">zh-HK</option>
            <option value="en-US">en-US</option>
            <option value="ja-JP">ja-JP</option>
            <option value="ko-KR">ko-KR</option>
            <option value="es-419">es-419</option>
            <option value="es-ES">es-ES</option>
            <option value="pt-BR">pt-BR</option>
            <option value="fr-FR">fr-FR</option>
            <option value="de-DE">de-DE</option>
            <option value="it-IT">it-IT</option>
            <option value="ru-RU">ru-RU</option>
            <option value="tr-TR">tr-TR</option>
            <option value="hi-IN">hi-IN</option>
            <option value="pl-PL">pl-PL</option>
            <option value="nl-NL">nl-NL</option>
            <option value="sv-SE">sv-SE</option>
            <option value="fi-FI">fi-FI</option>
            <option value="no-NO">no-NO</option>
            <option value="da-DK">da-DK</option>
            <option value="cs-CZ">cs-CZ</option>
            <option value="hu-HU">hu-HU</option>
            <option value="ro-RO">ro-RO</option>
            <option value="uk-UA">uk-UA</option>
            <option value="el-GR">el-GR</option>
            <option value="he-IL">he-IL</option>
            <option value="tl-PH">tl-PH</option>
            <option value="ar-SA">ar-SA</option>
            <option value="vi-VN">vi-VN</option>
            <option value="th-TH">th-TH</option>
            <option value="id-ID">id-ID</option>
            <option value="ms-MY">ms-MY</option>
        </select>
    </div>
    <div class="item">
        <label id="label-mode"></label>
        <select id="mode-select">
            <option value="fallback"></option>
            <option value="force_ai"></option>
            <option value="native"></option>
        </select>
    </div>
  </div>

  <div class="item">
    <label id="label-engine"></label>
    <select id="engine-select">
      <option value="google"></option>
      <option value="custom_llm"></option>
    </select>
  </div>

  <div class="item">
    <label id="label-model"></label>
    <div class="key-row">
      <div class="item" style="margin-bottom: 0;">
        <select id="ai-model-select"></select>
      </div>
      <button type="button" id="export-models-btn" class="btn-export">Export model list</button>
    </div>
    <input type="text" id="ai-model" placeholder="" style="display:none; margin-top:6px;">
    <div id="models-hint" class="hint"></div>
  </div>

  <div class="item">
    <button type="button" id="load-models-btn" class="btn-secondary" style="width: 100%;"></button>
  </div>

  <button id="save-btn"></button>
  <button id="download-en-btn" type="button" style="width: 100%; margin-top: 10px; padding: 9px; background: #1f3a2d; border: 1px solid #3f8f63; color: #c8f0d8; border-radius: 4px; cursor: pointer;"></button>
  <button id="open-options-btn" type="button" style="width: 100%; margin-top: 10px; padding: 9px; background: #2a3d4f; border: 1px solid #4a7bb5; color: #dfeeff; border-radius: 4px; cursor: pointer;">Open full settings</button>
  <button id="open-debug-btn" type="button" style="width: 100%; margin-top: 8px; padding: 9px; background: #3d2d1a; border: 1px solid #8d5b2a; color: #f4d7b1; border-radius: 4px; cursor: pointer;">Open debug</button>
  <script src="models-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
